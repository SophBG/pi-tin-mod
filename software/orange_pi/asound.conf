# Pi Tin: the MAX98357A plays one channel (or the mix, depending on its SD pin), so both
# channels carry (L+R)/2. Softvol adds a "Master" volume control: amixer sset Master 60%
pcm.pitin_mono {
	type route
	slave.pcm "plughw:CARD=pitin,DEV=0"
	slave.channels 2
	ttable.0.0 0.5
	ttable.1.0 0.5
	ttable.0.1 0.5
	ttable.1.1 0.5
}

pcm.pitin_vol {
	type softvol
	slave.pcm "pitin_mono"
	control.name "Master"
	control.card pitin
}

pcm.!default {
	type plug
	slave.pcm "pitin_vol"
}

ctl.!default {
	type hw
	card pitin
}
