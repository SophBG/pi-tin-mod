# RetroArch overlay for pitin-daemon's hotkey list (SPECIAL + SELECT). Overlay 0 is empty (normal play);
# pitin-daemon sends OVERLAY_NEXT when the list opens and again when it closes. install.sh copies the card in the
# console's language to card.png.
overlays = 2
overlay0_name = "off"
overlay0_full_screen = true
overlay0_normalized = true
overlay0_aspect_ratio = 1.333333
overlay0_descs = 0
overlay1_name = "card"
overlay1_overlay = "card.png"
overlay1_full_screen = true
overlay1_normalized = true
overlay1_aspect_ratio = 1.333333
overlay1_rect = "0.0,0.0,1.0,1.0"
overlay1_descs = 0
