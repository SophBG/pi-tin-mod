# RetroArch overlay for pitin-daemon's cards. Overlay 0 is empty (normal play), 1 the hotkey list (SPECIAL + SELECT),
# 2 the question when a phone or computer asks to open the settings page. OVERLAY_NEXT goes to the next one, and from
# the last back to 0: pitin-daemon sends it once or twice. install.sh copies the cards in the console's language to
# card.png and ask.png.
overlays = 3
overlay0_name = "off"
overlay0_full_screen = true
overlay0_normalized = true
overlay0_aspect_ratio = 1.333333
overlay0_descs = 0
overlay1_name = "card"
overlay1_overlay = "card.png"
overlay1_full_screen = true
overlay1_normalized = true
overlay1_aspect_ratio = 1.333333
overlay1_rect = "0.0,0.0,1.0,1.0"
overlay1_descs = 0
overlay2_name = "ask"
overlay2_overlay = "ask.png"
overlay2_full_screen = true
overlay2_normalized = true
overlay2_aspect_ratio = 1.333333
overlay2_rect = "0.0,0.0,1.0,1.0"
overlay2_descs = 0
