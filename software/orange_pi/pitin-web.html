<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pi Tin</title>
<style>
/* One column on a phone, two on a computer. The console drawing uses the real faceplate and LED
   positions; the page stays monochrome so the only colour on it is the lights'. */
:root {
  --bg: #eceef1; --card: #ffffff; --ink: #16191d; --muted: #5c636c; --line: #d6dae0;
  --btn: #dfe3e8; --led-off: #c6ccd4; --warn: #b43c0a; --ok: #1f7a4d;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f1113; --card: #181b1f; --ink: #eef1f4; --muted: #98a1ab; --line: #2a2f35;
    --btn: #23272c; --led-off: #2c3137; --warn: #ff8a5c; --ok: #5fd39a; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0f1113; --card: #181b1f; --ink: #eef1f4; --muted: #98a1ab; --line: #2a2f35;
  --btn: #23272c; --led-off: #2c3137; --warn: #ff8a5c; --ok: #5fd39a; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-ui); -webkit-text-size-adjust: 100%; }
main { max-width: 480px; margin: 0 auto; display: grid; gap: 12px; padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 24px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.top-right { display: flex; align-items: center; gap: 12px; }
#status { font-size: 13px; color: var(--muted); text-align: right; }
.bad { color: var(--warn) !important; }
.good { color: var(--ok) !important; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
h2 { font-size: 17px; font-weight: 650; margin: 0; }
h3 { font-size: 14px; font-weight: 600; margin: 0; color: var(--muted); }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
button { font: inherit; color: inherit; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 14px; min-height: 42px; cursor: pointer; font-size: 15px; }
.btn:hover { background: var(--btn); }
.btn.solid { background: var(--ink); color: var(--card); border-color: var(--ink); }
.btn.danger { color: var(--warn); }
.btn.armed { background: var(--warn); border-color: var(--warn); color: var(--card); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.panel { display: grid; gap: 12px; min-width: 0; }

/* tabs */
nav { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--btn); border-radius: 12px; padding: 4px; gap: 4px; }
nav button { border: 0; background: transparent; padding: 10px 0; border-radius: 9px; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--muted); }
nav button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

/* console drawing */
.console svg { width: 100%; height: auto; display: block; }
.console .plate { fill: var(--btn); stroke: var(--line); stroke-width: .25; }
.console .cap { fill: var(--card); stroke: var(--line); stroke-width: .25; }
.console .arm { fill: transparent; cursor: pointer; }
.console .arm:hover { fill: color-mix(in srgb, var(--ink) 8%, transparent); }
.console .key { fill: var(--card); stroke: var(--line); stroke-width: .25; cursor: pointer; }
.console .key:hover { fill: var(--line); }
.console .lbl.big { font-size: 2.3px; }
.console .lbl { fill: var(--muted); font: 600 1.5px var(--font-ui); text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.console .led { fill: var(--led-off); stroke: var(--line); stroke-width: .2; }
.console .hit { fill: transparent; cursor: pointer; }
.console .ring { fill: none; stroke: var(--ink); stroke-width: .35; }
.console .ord { fill: var(--ink); font: 700 2px var(--font-num); text-anchor: middle; dominant-baseline: middle; pointer-events: none; }

/* choices */
.fx { display: grid; gap: 2px; }
.fx label { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 9px 6px; border-radius: 10px; cursor: pointer; }
.fx label:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.fx input { margin: 2px 0 0; accent-color: var(--ink); width: 20px; height: 20px; }
.fx b { font-weight: 600; display: block; }
.fx span { font-size: 14px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid var(--line); background: var(--card); border-radius: 20px; padding: 8px 14px; min-height: 40px; font-size: 14px; cursor: pointer; }
.chips button:hover { background: var(--btn); }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.row { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 12px; }
.row > label { font-size: 15px; color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--ink); height: 28px; }
.val { font: 14px var(--font-num); min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }

/* colours */
.colours { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); padding: 0; cursor: pointer; }
.sw.on { outline: 2px solid var(--ink); outline-offset: 2px; }
.pick { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 5px; border: 1px solid var(--line); border-radius: 20px; font-size: 14px; cursor: pointer; }
.pick:hover { background: var(--btn); }
.pick.on { outline: 2px solid var(--ink); outline-offset: 2px; }
.pick i { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--card); background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
.pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }

/* switch */
.switch { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); cursor: pointer; }
.switch input { position: relative; appearance: none; margin: 0; width: 50px; height: 30px; border-radius: 15px; background: var(--line); cursor: pointer; transition: background .15s; flex: none; }
.switch input:checked { background: var(--ink); }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); transition: transform .15s; }
.switch input:checked::after { transform: translateX(20px); }

/* games */
.meter { height: 8px; background: var(--btn); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--btn); border-radius: 11px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 9px 6px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.dest { font-size: 14px; color: var(--muted); margin: 0; }
.dest b { color: var(--ink); font-weight: 600; }
.drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 20px 12px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.drop.over { border-color: var(--ink); background: var(--btn); }
.drop .or { font-size: 14px; color: var(--muted); }
@media (hover: none) { .drop .or { display: none; } }
.choose { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.choose input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.ups { display: grid; }
.up { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 2px; border-top: 1px solid var(--line); }
.up:first-child { border-top: 0; }
.up .name { overflow-wrap: anywhere; }
.up .to { font-size: 13px; color: var(--muted); display: flex; gap: 5px; align-items: center; min-width: 0; overflow-wrap: anywhere; }
.up .state { grid-row: 1 / 3; grid-column: 2; align-self: center; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.up progress { width: 70px; accent-color: var(--ink); }
.up svg, .node svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round; }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 6px 8px; border-radius: 8px; min-height: 36px; }
.x:hover { background: var(--btn); }
.x.armed { background: var(--warn); color: var(--card); }
.tree { display: grid; font-size: 15px; }
.node { display: grid; grid-template-columns: calc(var(--d, 0) * 16px) 12px 18px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 10px; min-height: 44px; }
.node.folder { cursor: pointer; }
.node.folder:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.node.sel { background: var(--btn); box-shadow: inset 3px 0 0 var(--ink); }
.node .chev { color: var(--muted); font-size: 9px; text-align: center; transition: transform .12s; }
.node.open .chev { transform: rotate(90deg); }
.node.file svg { color: var(--muted); }
.node .label { min-width: 0; overflow-wrap: anywhere; }
.node .label b { font-weight: 600; }
.node .label code { display: block; font: 12px var(--font-num); color: var(--muted); }
.node .meta { font-size: 13px; color: var(--muted); white-space: nowrap; }
.node.fresh .label::after { content: attr(data-new); display: inline-block; white-space: nowrap; margin-left: 8px; font: 600 11px var(--font-ui); letter-spacing: .04em; text-transform: uppercase; color: var(--ok); }
.empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }
.newdir { display: flex; gap: 8px; }
.newdir input { flex: 1 1 auto; width: 0; min-width: 0; font: inherit; font-size: 16px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }

/* console tab */
dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font-size: 15px; }
dt { color: var(--muted); }
dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
dl.keys dt { font: 14px var(--font-num); color: var(--ink); white-space: nowrap; }
dl.keys dd { color: var(--muted); }

/* a computer: two columns */
@media (min-width: 900px) {
  main { max-width: 1040px; }
  #panel-leds, #panel-games, #panel-system { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }
  #panel-leds > .console { grid-column: 1; grid-row: 1 / span 6; position: sticky; top: 16px; }
  #panel-leds > section:not(.console) { grid-column: 2; }
  #panel-games > .tree-card { grid-column: 2; grid-row: 1 / span 4; }
  #panel-games > section:not(.tree-card) { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) { .switch input, .switch input::after, .node .chev { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pi Tin</h1>
    <div class="top-right">
      <span id="status" data-t="connecting"></span>

    <button role="tab" id="tab-system" aria-controls="panel-system" aria-selected="false" data-t="tab_system"></button>

  row.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } };
  return row;
}
function fileRow(parent, f, depth) {
  const path = join(parent.path, f.name), row = document.createElement("div");
  row.className = "node file" + (fresh.has(path) ? " fresh" : "");
  row.style.setProperty("--d", depth); row.setAttribute("role", "treeitem");
  row.innerHTML = `<span></span><span></span>${ICON.file}<span class="label"></span><span class="meta"></span><span></span>`;
  row.querySelector(".label").textContent = f.name;
  row.querySelector(".label").dataset.new = t("new_badge");
  row.querySelector(".meta").textContent = fmtSize(f.size);
  row.lastChild.replaceWith(delButton(path, f.name));
  return row;
}
function delButton(path, name) {
  const x = Object.assign(document.createElement("button"), {type: "button", className: "x", textContent: t("delete")});
  x.setAttribute("aria-label", t("delete") + " " + name);
  armed(x, () => t("sure"), () => api("/api/roms/" + encPath(path), {method: "DELETE"}).then(loadTree).catch(e => setStatus("", true, errText(e))));
  return x;
}
// Two-step buttons: the first tap arms, the second (within 3 s) confirms.
function armed(btn, armedText, action) {
  let t0 = null;
  btn.onclick = () => {
    if (!btn.classList.contains("armed")) {
      btn.dataset.text = btn.textContent; btn.classList.add("armed"); btn.textContent = armedText();
      t0 = setTimeout(() => { btn.classList.remove("armed"); btn.textContent = btn.dataset.text; }, 3000);
      return;
    }
    clearTimeout(t0); btn.classList.remove("armed"); btn.textContent = btn.dataset.text; action();
  };
}
$("mode-auto").onclick = () => { mode = "auto"; renderDest(); };
$("mode-folder").onclick = () => { mode = "folder"; renderDest(); };
$("collapse").onclick = () => { expanded.clear(); expanded.add(""); renderTree(); };
$("mkdir").onclick = () => {
  const name = $("newdir").value.trim(); if (!name) return setStatus("", true, T[lang].err.name_needed);
  const path = join(target, name);
  post("/api/folders/" + encPath(path), {}).then(() => { $("newdir").value = ""; expanded.add(target); target = path; return loadTree(); })
    .catch(e => setStatus("", true, errText(e)));
};
$("newdir").onkeydown = e => { if (e.key === "Enter") $("mkdir").click(); };

function upload(file, dir, replace) {
  const row = Object.assign(document.createElement("div"), {className: "up"});
  const stateEl = Object.assign(document.createElement("div"), {className: "state"});
  const to = Object.assign(document.createElement("div"), {className: "to"});
  to.innerHTML = ICON.folder; to.append(folderTitle(dir));
  row.append(Object.assign(document.createElement("div"), {className: "name", textContent: file.name}), stateEl, to);
  $("uploads").prepend(row);
  const say = (text, cls) => { stateEl.innerHTML = ""; stateEl.append(Object.assign(document.createElement("span"), {textContent: text, className: cls || ""})); };
  const askReplace = () => {
    say(t("up_there"));
    const b = Object.assign(document.createElement("button"), {type: "button", className: "x", textContent: t("up_replace")});
    b.onclick = () => { row.remove(); upload(file, dir, true); };
    stateEl.append(b);
  };
  if (!replace && hasFile(dir, file.name)) return askReplace();
  const bar = Object.assign(document.createElement("progress"), {max: 1, value: 0});
  stateEl.append(bar);
  const xhr = new XMLHttpRequest();
  xhr.open("PUT", "/api/roms/" + encPath(join(dir, file.name)) + (replace ? "?replace=1" : ""));
  xhr.upload.onprogress = e => { if (e.lengthComputable) bar.value = e.loaded / e.total; };
  xhr.onload = () => {
    let body = {}; try { body = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status === 200) { say(t("up_done"), "good"); fresh.add(join(dir, file.name)); expanded.add(dir); loadTree(); }
    else if (body.exists) askReplace();
    else say(T[lang].err[body.code] || body.error || t("up_failed"), "bad");
  };
  xhr.onerror = () => say(t("up_stopped"), "bad");
  xhr.send(file);
}
function uploadAll(files) {
  const batch = [...files];
  for (const f of batch) upload(f, destFor(f, batch), false);
}
$("files").onchange = e => { uploadAll(e.target.files); e.target.value = ""; };
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); uploadAll(e.dataTransfer.files); };

// ------------------------------------------------------------------ console
let info = null;
function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + " " + T[lang].day + " " : "") + (h ? h + " h " : "") + m + " min";
}
function renderInfo() {
  const dl = $("info"); dl.innerHTML = "";
  if (!info) return;
  const i = info, nf = new Intl.NumberFormat(lang, {maximumFractionDigits: 1, minimumFractionDigits: 1});
  const rows = [
    ["i_address", i.ip ? `http://${i.ip}${i.port === 80 ? "" : ":" + i.port}` : t("i_none")],
    ["i_name", i.hostname],
    ["i_menu", i.retroarch === "active" ? t("i_running") : t("i_stopped")],
    ["i_temp", i.temp_c != null ? nf.format(i.temp_c) + " °C" : t("unknown")],
    ["i_up", i.uptime_s != null ? fmtUptime(i.uptime_s) : t("unknown")],
    ["i_free", i.drive && i.drive.mounted ? fmtSize(i.drive.free) : t("i_away")],
  ];
  for (const [k, v] of rows) dl.append(Object.assign(document.createElement("dt"), {textContent: t(k)}), Object.assign(document.createElement("dd"), {textContent: v}));
}
function loadInfo() {
  api("/api/info").then(i => {
    info = i; renderInfo();
    const hasVol = i.volume != null;
    $("volume").disabled = !hasVol;
    if (hasVol && Date.now() - volInput > 1500) { $("volume").value = i.volume; $("vv").textContent = i.volume + " %"; }
    if (!hasVol) $("vv").textContent = "–";
    $("volume-note").hidden = hasVol;
  }).catch(e => setStatus("", true, errText(e)));
}
let volTimer = null, volInput = 0;
$("volume").oninput = e => {
  volInput = Date.now(); $("vv").textContent = e.target.value + " %";
  clearTimeout(volTimer);
  volTimer = setTimeout(() => post("/api/volume", {volume: +e.target.value}).catch(err => setStatus("", true, errText(err))), 120);
};
for (const b of document.querySelectorAll("[data-power]")) {
  armed(b, () => t("tap_again"), () => post("/api/power", {action: b.dataset.power}).then(() => setStatus("p_" + b.dataset.power))
    .catch(e => setStatus("", true, errText(e))));
}
const KEYS = [["X", "k_menu"], ["L1 / R1", "k_state"], ["◀ / ▶", "k_slot"], ["▲ / ▼", "k_vol"], ["B", "k_reset"],
              ["START", "k_quit"], ["L2 / R2", "k_bright"], ["Y", "k_leds"], ["A", "k_fx"], ["SELECT", "k_quick"]];
function renderKeys() {
  const dl = $("keys"); dl.innerHTML = "";
  for (const [k, v] of KEYS) dl.append(Object.assign(document.createElement("dt"), {textContent: k}), Object.assign(document.createElement("dd"), {textContent: t(v)}));
}

// ------------------------------------------------------------------ language
function applyLang() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  for (const el of document.querySelectorAll("[data-t-aria]")) el.setAttribute("aria-label", t(el.dataset.tAria));
  $("leds_on").setAttribute("aria-label", t("lights_on"));
  $("color").setAttribute("aria-label", t("more_colours"));
  if (statusKey) setStatus(statusKey, statusBad);
  show(st); renderDest(); renderTree(); if (lastDrive) showDrive(lastDrive); renderInfo(); renderKeys();
}
window.addEventListener("languagechange", () => { lang = browserLang(); applyLang(); });

applyLang();
poll(); setInterval(poll, 5000);
setInterval(() => { if (!$("panel-system").hidden) loadInfo(); }, 10000);
openTab(location.hash.slice(1));
window.addEventListener("hashchange", () => openTab(location.hash.slice(1)));
</script>
