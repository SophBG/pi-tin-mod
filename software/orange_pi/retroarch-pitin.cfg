# Pi Tin settings for RetroArch, loaded on top of the user's config with --appendconfig.

# Video: KMS straight to the SPI screen (no desktop). The SPI link sets the frame rate,
# so timing follows the audio instead of the display.
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_vsync = "false"
video_threaded = "false"
video_smooth = "false"
menu_driver = "rgui"

# Audio: ALSA default device = /etc/asound.conf (mono mix + "Master" volume).
audio_driver = "alsa"
audio_device = "default"
audio_sync = "true"
audio_latency = "64"
audio_volume = "-6.000000"

# Input: the overlay's "Pi Tin Gamepad" (gpio-keys). Button numbers as RetroArch's udev
# driver assigns them: B 0, A 1, X 2, Y 3, L1 4, R1 5, L2 6, R2 7, SELECT 8, START 9,
# SPECIAL 10, UP 11, DOWN 12, LEFT 13, RIGHT 14.
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/etc/pitin/autoconfig"
input_player1_joypad_index = "0"
input_player1_b_btn = "0"
input_player1_a_btn = "1"
input_player1_x_btn = "2"
input_player1_y_btn = "3"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_l2_btn = "6"
input_player1_r2_btn = "7"
input_player1_select_btn = "8"
input_player1_start_btn = "9"
input_player1_up_btn = "11"
input_player1_down_btn = "12"
input_player1_left_btn = "13"
input_player1_right_btn = "14"

# Hotkeys: hold SPECIAL (10) and press the button (same map as the original Pi Tin).
# SPECIAL + L2 / R2 (screen brightness), + UP / DOWN (volume), + Y / A (LEDs), + SELECT (hotkey list),
# + START (quit), + B (reset) and + L1 (load state) are handled by pitin-daemon: only when held for a second, so
# that a slip doesn't lose progress (it sends RetroArch CLOSE_CONTENT, RESET or LOAD_STATE).
input_enable_hotkey_btn = "10"
input_menu_toggle_btn = "2"            # X: RetroArch menu
input_load_state_btn = "nul"           # L1 (held): pitin-daemon loads the state
input_save_state_btn = "5"             # R1
input_volume_up_btn = "nul"            # UP / DOWN: pitin-daemon's volume (the same as the web page's)
input_volume_down_btn = "nul"
input_state_slot_decrease_btn = "13"   # LEFT: previous save slot
input_state_slot_increase_btn = "14"   # RIGHT: next save slot
input_reset_btn = "nul"                # B (held): pitin-daemon restarts the game
input_close_content_btn = "nul"        # START (held): pitin-daemon quits the game, back to the menu
confirm_close = "false"                # the hold is the confirmation

# pitin-daemon shows its hotkeys' values as on-screen text, and SPECIAL + SELECT pauses the game and shows its card
# (an overlay: the list of hotkeys), through RetroArch's network commands (UDP 55355). The overlay's first
# image is empty, so nothing shows outside the menu. Smaller on-screen text for the 320 px screen.
network_cmd_enable = "true"
network_cmd_port = "55355"
video_font_size = "14"
input_overlay_enable = "true"
input_overlay = "/etc/pitin/overlay/pitin-menu.cfg"
input_overlay_opacity = "1.000000"
input_overlay_scale = "1.000000"
input_overlay_hide_in_menu = "false"
input_overlay_hide_when_gamepad_connected = "false"
input_overlay_auto_scale = "false"
input_overlay_show_inputs = "0"

# Save and resume automatically (the power button stops RetroArch before power-off).
savestate_auto_save = "true"
savestate_auto_load = "true"

# ROMs live in the FAT image mounted on ~/roms (also the USB drive).
rgui_browser_directory = "~/roms"
libretro_directory = "/usr/lib/aarch64-linux-gnu/libretro"
libretro_info_path = "/usr/share/libretro/info"
